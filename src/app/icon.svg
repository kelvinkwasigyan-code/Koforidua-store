<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>
  
  <!-- Rounded Square Container -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Glow Circle -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.15" stroke-width="12" />

  <!-- Stylized Smartphone Silhouette -->
  <rect x="156" y="96" width="200" height="320" rx="36" fill="#ffffff" filter="url(#shadow)" />
  <rect x="176" y="136" width="160" height="230" rx="12" fill="#09090b" />
  
  <!-- Camera Notch / Dynamic Island -->
  <rect x="226" y="110" width="60" height="12" rx="6" fill="#09090b" />

  <!-- Vibrant Red "J" Monogram Inside Screen -->
  <path d="M 276 176 L 276 296 C 276 326 250 346 220 346 C 196 346 178 332 172 312 L 202 302 C 205 312 212 320 222 320 C 236 320 248 310 248 294 L 248 176 Z" fill="#ef4444" />

  <!-- Home Indicator Bar -->
  <rect x="216" y="394" width="80" height="8" rx="4" fill="#ffffff" />
</svg>
